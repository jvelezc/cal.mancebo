name: Mancebo scheduling images

on:
  push:
    branches: [main, 'codex/mancebo-scheduling-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mancebo-scheduling-images-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://mancebo_build:build_only_password@127.0.0.1:5432/mancebo_build
  DATABASE_DIRECT_URL: postgresql://mancebo_build:build_only_password@127.0.0.1:5432/mancebo_build
  NEXTAUTH_SECRET: mancebo-ci-session-placeholder-not-production
  CALENDSO_ENCRYPTION_KEY: mancebo-build-only-encryption-0001
  CALCOM_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_DISABLE_SIGNUP: 'true'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'true'

jobs:
  type-check:
    if: github.repository == 'jvelezc/cal.mancebo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: node scripts/mancebo-brand-assets.cjs --check
      - run: TZ=UTC yarn vitest run packages/features/auth/lib/mancebo-principal.test.ts packages/features/auth/lib/mancebo-auth.test.ts packages/features/auth/lib/mancebo-sign-out.test.ts packages/features/auth/lib/mancebo-workspaces.test.ts packages/features/auth/lib/mancebo-email-actor.test.ts apps/web/pages/api/mancebo/email-templates.test.ts apps/web/modules/mancebo-email/ConfirmationEmailForm.test.tsx apps/web/modules/mancebo-email/AppointmentEmailSettings.test.tsx apps/web/modules/auth/ManceboSessionBridge.test.tsx apps/web/modules/onboarding/getting-started/onboarding-view.test.tsx apps/web/modules/shell/components/WelcomeToCalcomModal.test.tsx packages/i18n/mancebo-brand.test.ts packages/emails/lib/mailDeliveryEvidence.test.ts packages/emails/lib/manceboConfirmationContent.test.ts packages/emails/lib/manceboEmailPolicy.test.ts packages/emails/templates/mancebo-confirmation.test.ts apps/web/proxy.test.ts packages/features/credentials/handleDeleteCredential.ownership.test.ts
      - run: yarn type-check:ci --force

  build:
    if: github.repository == 'jvelezc/cal.mancebo'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: Dockerfile
          - component: api
            dockerfile: apps/api/v2/Dockerfile
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: mancebo_build
          POSTGRES_PASSWORD: build_only_password
          POSTGRES_DB: mancebo_build
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U mancebo_build -d mancebo_build" --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reserve space on the disposable build runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host
      - name: Build without production credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          network: host
          allow: network.host
          push: false
          cache-from: type=gha,scope=scheduling-${{ matrix.component }}
          build-args: |
            DATABASE_URL=${{ env.DATABASE_URL }}
            DATABASE_DIRECT_URL=${{ env.DATABASE_DIRECT_URL }}
            NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}
            CALENDSO_ENCRYPTION_KEY=${{ env.CALENDSO_ENCRYPTION_KEY }}
            CALCOM_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_DISABLE_SIGNUP=true
            NEXT_PUBLIC_MANCEBO_AUTH_ENABLED=true
            NEXT_PUBLIC_WEBAPP_URL=https://appointments.mancebo.ai
            NEXT_PUBLIC_API_V2_URL=https://appointments.mancebo.ai/api/v2
            MANCEBO_BUILD_DATABASE_INITIALIZE=true
      - name: Obtain short-lived image-publishing identity
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/500298530637/locations/global/workloadIdentityPools/mancebo-scheduling-github/providers/github
          service_account: mancebo-scheduling-builder@gbmigration-7d3cb.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}
      - name: Publish the already-built source revision
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          network: host
          allow: network.host
          push: true
          tags: us-central1-docker.pkg.dev/gbmigration-7d3cb/mancebo-scheduling/${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jvelezc/cal.mancebo
            org.opencontainers.image.revision=${{ github.sha }}
            ai.mancebo.service=scheduling-${{ matrix.component }}
          cache-to: type=gha,scope=scheduling-${{ matrix.component }},mode=max
          build-args: |
            DATABASE_URL=${{ env.DATABASE_URL }}
            DATABASE_DIRECT_URL=${{ env.DATABASE_DIRECT_URL }}
            NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}
            CALENDSO_ENCRYPTION_KEY=${{ env.CALENDSO_ENCRYPTION_KEY }}
            CALCOM_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_DISABLE_SIGNUP=true
            NEXT_PUBLIC_MANCEBO_AUTH_ENABLED=true
            NEXT_PUBLIC_WEBAPP_URL=https://appointments.mancebo.ai
            NEXT_PUBLIC_API_V2_URL=https://appointments.mancebo.ai/api/v2
            MANCEBO_BUILD_DATABASE_INITIALIZE=true
      - name: Record the image receipt
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          printf '{"source":"%s","component":"%s","digest":"%s"}\n' "$GITHUB_SHA" "$COMPONENT" "$IMAGE_DIGEST" > "image-receipt-$COMPONENT.json"
          cat "image-receipt-$COMPONENT.json"
